name: Build debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Toujours exécuté, même si la porte ci-dessous échoue : c'est ce qui
      # permet de récupérer un schéma généré par le vrai compilateur Room
      # (identityHash inclus) au lieu d'en fabriquer un à la main — voir
      # app/schemas/README.md.
      - name: Upload generated Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore

      # Temporaire : le téléchargement direct de l'artefact "room-schemas"
      # n'est pas accessible depuis l'environnement de développement de ce
      # commit (réseau restreint). En attendant, le contenu passe par les
      # logs, seule voie accessible dans cet environnement. À retirer une
      # fois le premier schéma committé pour de vrai.
      - name: Dump generated Room schemas (base64, temporary)
        if: always()
        run: |
          find app/schemas -type f | while read -r f; do
            echo "===FILE=== $f"
            base64 -w0 "$f"
            echo
            echo "===END==="
          done

      # Porte de qualité G5 (§E6) : un schéma Room exporté mais jamais
      # committé est aussi dangereux qu'absent — c'est exactement ce qui a
      # laissé la migration 1→2 sans preuve pendant des mois (dette D3). Le
      # build échoue si la compilation a produit un schéma différent de celui
      # du dépôt, pour qu'il soit structurellement impossible d'oublier de
      # `git add app/schemas/`.
      - name: Verify Room schemas are committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::app/schemas/ a changé pendant la compilation mais n'a pas été committé."
            echo "Récupère l'artefact 'room-schemas' de ce run et committe-le, ou lance"
            echo "./gradlew assembleDebug en local et committe le contenu de app/schemas/."
            git status --porcelain app/schemas
            git diff app/schemas
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
